<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js" integrity="sha384-sG0Hv1tP1lZCk9KQmrIbY/XNwi+OY84GQqhMscbnsoBFqAz8KNCil1kvfL3Hbbk2" crossorigin="anonymous"></script>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background: #000;
      }
      #root {
        position: relative;
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background: #eef5f3;
      }
      .scene {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
      }
    </style>
  </head>
  <body>
    <div
      id="root"
      data-composition-id="main"
      data-start="0"
      data-duration="55"
      data-width="1920"
      data-height="1080"
    >
      <div
        id="el-01-ten-seconds"
        class="scene"
        data-composition-id="01-ten-seconds"
        data-composition-src="compositions/frames/01-ten-seconds.html"
        data-start="0"
        data-duration="7.5"
        data-track-index="0"
      ></div>

      <div
        id="el-02-four-seconds"
        class="scene"
        data-composition-id="02-four-seconds"
        data-composition-src="compositions/frames/02-four-seconds.html"
        data-start="7"
        data-duration="8.4"
        data-track-index="1"
      ></div>

      <div
        id="el-03-staring"
        class="scene"
        data-composition-id="03-staring"
        data-composition-src="compositions/frames/03-staring.html"
        data-start="15"
        data-duration="10.6"
        data-track-index="0"
      ></div>

      <div
        id="el-04-kanshan-steps"
        class="scene"
        data-composition-id="04-kanshan-steps"
        data-composition-src="compositions/frames/04-kanshan-steps.html"
        data-start="25"
        data-duration="10.5"
        data-track-index="1"
      ></div>

      <div
        id="el-05-privacy"
        class="scene"
        data-composition-id="05-privacy"
        data-composition-src="compositions/frames/05-privacy.html"
        data-start="35"
        data-duration="10.4"
        data-track-index="0"
      ></div>

      <div
        id="el-06-cta"
        class="scene"
        data-composition-id="06-cta"
        data-composition-src="compositions/frames/06-cta.html"
        data-start="45"
        data-duration="10"
        data-track-index="1"
      ></div>

    </div>

    <script>
      window.__timelines = window.__timelines || {};
      window.__timelines["main"] = gsap.timeline({ paused: true });
      // ── frame transitions (injected by transitions.mjs) ──
      (function () { var tl = window.__timelines["main"];
        tl.to("#el-01-ten-seconds", { opacity: 0, duration: 0.5, ease: "power2.inOut" }, 7);
        tl.fromTo("#el-02-four-seconds", { opacity: 0 }, { opacity: 1, duration: 0.5, ease: "power2.inOut" }, 7);
        tl.to("#el-02-four-seconds", { scale: 2.5, opacity: 0, filter: "blur(8px)", duration: 0.4, ease: "power3.in" }, 15);
        tl.fromTo("#el-03-staring", { scale: 0.5, opacity: 0, filter: "blur(8px)" }, { scale: 1, opacity: 1, filter: "blur(0px)", duration: 0.4, ease: "power3.out" }, 15);
        tl.to("#el-03-staring", { filter: "blur(10px)", scale: 1.03, opacity: 0, duration: 0.6, ease: "power2.inOut" }, 25);
        tl.fromTo("#el-04-kanshan-steps", { filter: "blur(10px)", scale: 0.97, opacity: 0 }, { filter: "blur(0px)", scale: 1, opacity: 1, duration: 0.6, ease: "power2.inOut" }, 25);
        tl.to("#el-04-kanshan-steps", { opacity: 0, duration: 0.5, ease: "power2.inOut" }, 35);
        tl.fromTo("#el-05-privacy", { opacity: 0 }, { opacity: 1, duration: 0.5, ease: "power2.inOut" }, 35);
        tl.to("#el-05-privacy", { scale: 2.5, opacity: 0, filter: "blur(8px)", duration: 0.4, ease: "power3.in" }, 45);
        tl.fromTo("#el-06-cta", { scale: 0.5, opacity: 0, filter: "blur(8px)" }, { scale: 1, opacity: 1, filter: "blur(0px)", duration: 0.4, ease: "power3.out" }, 45);
        tl.to({}, { duration: 55 }, 0); // full-span anchor — main.duration() == composition total (Studio master duration)
      })();
    </script>
  </body>
</html>
