<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light" />
    <title>Lumi · 小红书轮播预览</title>
    <style>
      :root {
        color: #173d3a;
        background: #102f2d;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", sans-serif;
        font-synthesis: none;
        --ink: #173d3a;
        --deep: #102f2d;
        --coral: #e96f5b;
        --mist: #edf5f2;
        --paper: #f9fbfa;
        --muted: #6b8380;
        --line: rgba(23, 61, 58, 0.14);
      }

      * { box-sizing: border-box; }
      html { scroll-behavior: smooth; }
      body { margin: 0; min-width: 320px; background: var(--deep); }
      button, a { font: inherit; }

      .page-header {
        max-width: 1440px;
        margin: 0 auto;
        padding: 64px 54px 44px;
        color: var(--paper);
      }

      .eyebrow {
        display: flex;
        align-items: center;
        gap: 14px;
        color: #9dc3bc;
        font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
        font-size: 13px;
        font-weight: 800;
        letter-spacing: 0.12em;
      }

      .eyebrow::before {
        width: 44px;
        height: 3px;
        background: var(--coral);
        content: "";
      }

      .header-row {
        display: flex;
        align-items: flex-end;
        justify-content: space-between;
        gap: 40px;
        margin-top: 26px;
      }

      h1 {
        max-width: 820px;
        margin: 0;
        font-size: clamp(42px, 6vw, 82px);
        font-weight: 900;
        letter-spacing: -0.065em;
        line-height: 0.98;
      }

      .header-note {
        max-width: 360px;
        margin: 0;
        color: #b9d0cb;
        font-size: 16px;
        font-weight: 650;
        line-height: 1.65;
      }

      .sequence {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        margin-top: 34px;
      }

      .sequence a {
        display: grid;
        width: 42px;
        height: 42px;
        place-items: center;
        border: 1px solid rgba(255, 255, 255, 0.25);
        border-radius: 50%;
        color: #dce9e5;
        font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
        font-size: 12px;
        font-weight: 850;
        text-decoration: none;
        transition: 160ms ease;
      }

      .sequence a:hover,
      .sequence a:focus-visible {
        border-color: var(--coral);
        background: var(--coral);
        color: #fff;
        outline: none;
        transform: translateY(-2px);
      }

      .gallery {
        display: grid;
        max-width: 1440px;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 38px;
        margin: 0 auto;
        padding: 24px 54px 90px;
      }

      .slide-card {
        min-width: 0;
        padding: 22px;
        border: 1px solid rgba(255, 255, 255, 0.46);
        border-radius: 28px;
        background: var(--paper);
        box-shadow: 0 28px 70px rgba(1, 19, 17, 0.24);
        scroll-margin-top: 24px;
      }

      .card-header {
        display: grid;
        grid-template-columns: 56px minmax(0, 1fr) auto;
        align-items: center;
        gap: 15px;
        min-height: 72px;
        padding: 0 2px 18px;
        border-bottom: 1px solid var(--line);
      }

      .card-index {
        color: var(--coral);
        font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
        font-size: 25px;
        font-weight: 900;
        letter-spacing: -0.06em;
      }

      .card-title h2 {
        margin: 0;
        color: var(--ink);
        font-size: 20px;
        font-weight: 850;
        letter-spacing: -0.025em;
      }

      .card-title p {
        margin: 4px 0 0;
        color: var(--muted);
        font-size: 13px;
        font-weight: 650;
      }

      .original-link {
        padding: 9px 12px;
        border: 1px solid var(--line);
        border-radius: 999px;
        color: #426864;
        font-size: 12px;
        font-weight: 800;
        text-decoration: none;
      }

      .original-link:hover,
      .original-link:focus-visible {
        border-color: var(--ink);
        color: var(--ink);
        outline: none;
      }

      .artwork-button {
        display: block;
        width: 100%;
        margin-top: 20px;
        padding: 0;
        overflow: hidden;
        border: 0;
        border-radius: 9px;
        background: #d8e6e2;
        cursor: zoom-in;
      }

      .artwork-button:focus-visible {
        outline: 4px solid var(--coral);
        outline-offset: 5px;
      }

      .artwork-button img {
        display: block;
        width: 100%;
        height: auto;
        aspect-ratio: 3 / 4;
        transition: transform 220ms ease;
      }

      .artwork-button:hover img { transform: scale(1.012); }

      dialog {
        width: min(92vw, 810px);
        max-height: 94vh;
        padding: 0;
        overflow: visible;
        border: 0;
        border-radius: 12px;
        background: transparent;
        box-shadow: 0 34px 100px rgba(0, 0, 0, 0.46);
      }

      dialog::backdrop { background: rgba(4, 20, 18, 0.88); backdrop-filter: blur(10px); }
      dialog img { display: block; width: 100%; max-height: 92vh; object-fit: contain; border-radius: 10px; }

      .dialog-close {
        position: absolute;
        top: 12px;
        right: 12px;
        display: grid;
        width: 42px;
        height: 42px;
        place-items: center;
        border: 0;
        border-radius: 50%;
        background: rgba(16, 47, 45, 0.88);
        color: #fff;
        font-size: 24px;
        line-height: 1;
        cursor: pointer;
      }

      .dialog-close:focus-visible { outline: 3px solid var(--coral); outline-offset: 3px; }

      @media (max-width: 900px) {
        .page-header { padding: 42px 22px 30px; }
        .header-row { align-items: flex-start; flex-direction: column; gap: 20px; }
        .header-note { max-width: 620px; }
        .gallery { grid-template-columns: 1fr; gap: 24px; padding: 16px 22px 60px; }
      }

      @media (max-width: 520px) {
        .slide-card { padding: 14px; border-radius: 20px; }
        .card-header { grid-template-columns: 44px minmax(0, 1fr); }
        .original-link { display: none; }
        .card-title h2 { font-size: 18px; }
      }

      @media (prefers-reduced-motion: reduce) {
        html { scroll-behavior: auto; }
        .sequence a, .artwork-button img { transition: none; }
      }
    </style>
  </head>
  <body>
    <header class="page-header">
      <div class="eyebrow">LUMI / XHS CAROUSEL / 01—06</div>
      <div class="header-row">
        <h1>小红书轮播<br />完整预览</h1>
        <p class="header-note">共 6 张，按发布顺序排列。点击任意图片查看大图，右上角可直接打开原始 PNG。</p>
      </div>
      <nav class="sequence" aria-label="跳转到指定图片">
        <a href="#slide-1">01</a><a href="#slide-2">02</a><a href="#slide-3">03</a>
        <a href="#slide-4">04</a><a href="#slide-5">05</a><a href="#slide-6">06</a>
      </nav>
    </header>

    <main class="gallery">
      <article class="slide-card" id="slide-1">
        <header class="card-header">
          <span class="card-index">01</span>
          <div class="card-title"><h2>痛点封面</h2><p>眼干眼涩 + 实时眨眼频率</p></div>
          <a class="original-link" href="deliverables/carousel/lumi-xhs-01-cover.png" target="_blank">打开原图 ↗</a>
        </header>
        <button class="artwork-button" type="button" data-preview="deliverables/carousel/lumi-xhs-01-cover.png" aria-label="放大查看痛点封面">
          <img src="deliverables/carousel/lumi-xhs-01-cover.png" alt="Lumi 小红书痛点封面" />
        </button>
      </article>

      <article class="slide-card" id="slide-2">
        <header class="card-header">
          <span class="card-index">02</span>
          <div class="card-title"><h2>眨眼提醒</h2><p>Lumi 提醒你慢慢眨 2 下</p></div>
          <a class="original-link" href="deliverables/carousel/lumi-xhs-02-blink-reminder.png" target="_blank">打开原图 ↗</a>
        </header>
        <button class="artwork-button" type="button" data-preview="deliverables/carousel/lumi-xhs-02-blink-reminder.png" aria-label="放大查看眨眼提醒">
          <img src="deliverables/carousel/lumi-xhs-02-blink-reminder.png" alt="Lumi 眨眼提醒介绍图" loading="lazy" />
        </button>
      </article>

      <article class="slide-card" id="slide-3">
        <header class="card-header">
          <span class="card-index">03</span>
          <div class="card-title"><h2>远眺提醒</h2><p>看屏 20 分钟，远眺 20 秒</p></div>
          <a class="original-link" href="deliverables/carousel/lumi-xhs-03-distance-break.png" target="_blank">打开原图 ↗</a>
        </header>
        <button class="artwork-button" type="button" data-preview="deliverables/carousel/lumi-xhs-03-distance-break.png" aria-label="放大查看远眺提醒">
          <img src="deliverables/carousel/lumi-xhs-03-distance-break.png" alt="Lumi 远眺提醒介绍图" loading="lazy" />
        </button>
      </article>

      <article class="slide-card" id="slide-4">
        <header class="card-header">
          <span class="card-index">04</span>
          <div class="card-title"><h2>久坐提醒</h2><p>Lumi 叫你起来走走</p></div>
          <a class="original-link" href="deliverables/carousel/lumi-xhs-04-sedentary-break.png" target="_blank">打开原图 ↗</a>
        </header>
        <button class="artwork-button" type="button" data-preview="deliverables/carousel/lumi-xhs-04-sedentary-break.png" aria-label="放大查看久坐提醒">
          <img src="deliverables/carousel/lumi-xhs-04-sedentary-break.png" alt="Lumi 久坐提醒介绍图" loading="lazy" />
        </button>
      </article>

      <article class="slide-card" id="slide-5">
        <header class="card-header">
          <span class="card-index">05</span>
          <div class="card-title"><h2>时间统计</h2><p>按小时回看眨眼次数</p></div>
          <a class="original-link" href="deliverables/carousel/lumi-xhs-05-time-stats.png" target="_blank">打开原图 ↗</a>
        </header>
        <button class="artwork-button" type="button" data-preview="deliverables/carousel/lumi-xhs-05-time-stats.png" aria-label="放大查看时间统计">
          <img src="deliverables/carousel/lumi-xhs-05-time-stats.png" alt="Lumi 时间统计介绍图" loading="lazy" />
        </button>
      </article>

      <article class="slide-card" id="slide-6">
        <header class="card-header">
          <span class="card-index">06</span>
          <div class="card-title"><h2>本地优先</h2><p>画面不上云，也不保存</p></div>
          <a class="original-link" href="deliverables/carousel/lumi-xhs-06-local-privacy.png" target="_blank">打开原图 ↗</a>
        </header>
        <button class="artwork-button" type="button" data-preview="deliverables/carousel/lumi-xhs-06-local-privacy.png" aria-label="放大查看本地隐私说明">
          <img src="deliverables/carousel/lumi-xhs-06-local-privacy.png" alt="Lumi 本地隐私介绍图" loading="lazy" />
        </button>
      </article>
    </main>

    <dialog aria-label="图片大图预览">
      <button class="dialog-close" type="button" aria-label="关闭大图">×</button>
      <img alt="" />
    </dialog>

    <script>
      const dialog = document.querySelector("dialog");
      const dialogImage = dialog.querySelector("img");

      document.querySelectorAll("[data-preview]").forEach((button) => {
        button.addEventListener("click", () => {
          dialogImage.src = button.dataset.preview;
          dialogImage.alt = button.querySelector("img").alt;
          dialog.showModal();
        });
      });

      dialog.querySelector(".dialog-close").addEventListener("click", () => dialog.close());
      dialog.addEventListener("click", (event) => {
        if (event.target === dialog) dialog.close();
      });
    </script>
  </body>
</html>
