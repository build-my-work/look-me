<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, initial-scale=1" />
    <title>Lumi 小红书封面</title>
    <style>
      * { box-sizing: border-box; margin: 0; padding: 0; }
      html, body { width: 1080px; height: 1440px; overflow: hidden; }
      body {
        color: #173d3a;
        background: #f4f8f6;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", sans-serif;
        -webkit-font-smoothing: antialiased;
      }
      .poster {
        position: relative;
        width: 100%;
        height: 100%;
        padding: 72px 76px 68px;
        overflow: hidden;
        border: 26px solid #173d3a;
      }
      .poster::before {
        position: absolute;
        width: 420px;
        height: 420px;
        top: 320px;
        right: -240px;
        border: 58px solid rgba(117, 185, 210, .25);
        border-radius: 50%;
        content: "";
      }
      .poster::after {
        position: absolute;
        width: 250px;
        height: 250px;
        left: -145px;
        bottom: 320px;
        border-radius: 50%;
        background: rgba(216, 154, 56, .2);
        content: "";
      }
      .topline { display: flex; align-items: center; justify-content: space-between; }
      .brand { display: flex; align-items: center; gap: 18px; font-size: 27px; font-weight: 850; }
      .brand-mark {
        display: grid; place-items: center; width: 68px; height: 68px;
        border: 4px solid #173d3a; border-radius: 50%; background: #fff;
        font-family: ui-monospace, Menlo, monospace; font-size: 20px; letter-spacing: -.08em;
      }
      .edition {
        padding: 13px 18px 11px; border: 3px solid #173d3a; border-radius: 999px;
        font-family: ui-monospace, Menlo, monospace; font-size: 18px; font-weight: 800; letter-spacing: .08em;
      }
      .hook { position: relative; z-index: 2; margin-top: 82px; }
      .eyebrow { color: #e96f5b; font-size: 24px; font-weight: 850; letter-spacing: .14em; }
      h1 { margin-top: 18px; font-size: 76px; font-weight: 900; line-height: 1.08; letter-spacing: -.065em; }
      h1 span { display: block; }
      h1 .accent { color: #e96f5b; }
      .cover-widget {
        position: relative; z-index: 4; display: flex; width: max-content; align-items: center; gap: 14px;
        margin-top: 40px; padding: 14px 16px 14px 18px; border: 2px solid rgba(49,95,102,.22);
        border-radius: 999px; background: #dcece8;
        box-shadow: 0 18px 38px rgba(55,73,69,.2), inset 0 0 0 2px rgba(255,255,255,.62);
      }
      .cover-widget-eye, .cover-widget-chart {
        display: grid; width: 56px; height: 56px; place-items: center; border-radius: 50%;
      }
      .cover-widget-eye { background: rgba(255,255,255,.7); color: #557b79; }
      .cover-widget-eye svg { width: 31px; height: 31px; }
      .cover-widget-copy { display: grid; gap: 2px; min-width: 155px; }
      .cover-widget-copy small { color: #6b8380; font-size: 15px; font-weight: 800; letter-spacing: .1em; }
      .cover-widget-copy strong { color: #244d53; font-size: 29px; font-weight: 900; line-height: 1.05; }
      .cover-widget-chart { margin-left: 4px; background: rgba(255,255,255,.74); color: #315f66; }
      .cover-widget-chart svg { width: 30px; height: 30px; }
      .cat {
        position: absolute; z-index: 1; width: 570px; right: -28px; bottom: 165px;
        filter: drop-shadow(0 24px 18px rgba(23, 61, 58, .16));
      }
      .pain-footer {
        position: absolute; z-index: 3; right: 76px; bottom: 70px; left: 76px;
        display: flex; align-items: flex-end; justify-content: space-between; gap: 28px;
        padding-top: 22px; border-top: 4px solid #173d3a;
      }
      .pain-footer strong { max-width: 620px; font-size: 30px; font-weight: 850; line-height: 1.3; }
    </style>
  </head>
  <body>
    <main class="poster">
      <div class="topline">
        <div class="brand"><span class="brand-mark">LU</span><span>LUMI</span></div>
        <div class="edition">01 / 06</div>
      </div>
      <section class="hook">
        <h1><span>盯屏时总忘记眨眼？</span><span class="accent">眼睛又干又涩？</span></h1>
        <div class="cover-widget" aria-label="实时眨眼频率 18 次每分钟，可打开统计">
          <span class="cover-widget-eye" aria-hidden="true">
            <svg viewBox="0 0 64 64" fill="none">
              <path d="M6 32s9-15 26-15 26 15 26 15-9 15-26 15S6 32 6 32Z" stroke="currentColor" stroke-width="5" stroke-linejoin="round" />
              <circle cx="32" cy="32" r="8" fill="currentColor" />
            </svg>
          </span>
          <span class="cover-widget-copy"><small>实时眨眼</small><strong>18 次/分</strong></span>
          <span class="cover-widget-chart" aria-hidden="true">
            <svg viewBox="0 0 64 64" fill="none">
              <path d="M10 48V16M10 48h44M17 39l10-10 9 7 14-17" stroke="currentColor" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" />
            </svg>
          </span>
        </div>
      </section>
      <img class="cat" src="../tool/assets/cat-idle.png" alt="异瞳白猫 Lumi" />
      <footer class="pain-footer">
        <strong>它叫 Lumi，帮你看着你的眨眼频率。</strong>
      </footer>
    </main>
  </body>
</html>
