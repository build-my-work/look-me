<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=512, initial-scale=1" />
    <title>Lumi 小工具图标</title>
    <style>
      * { box-sizing: border-box; margin: 0; padding: 0; }
      html, body { width: 512px; height: 512px; overflow: hidden; }
      body { background: #f4f8f6; }
      .icon {
        position: relative; width: 100%; height: 100%; overflow: hidden;
        border: 24px solid #173d3a; border-radius: 104px; background: #b9ddd3;
      }
      .icon::before, .icon::after {
        position: absolute; z-index: 2; top: 34px; width: 42px; height: 42px;
        border: 4px solid #173d3a; border-radius: 50%; content: "";
      }
      .icon::before { left: 38px; background: #d89a38; }
      .icon::after { right: 38px; background: #75b9d2; }
      img {
        position: absolute; width: 430px; height: auto; left: 17px; bottom: -112px;
        filter: drop-shadow(0 14px 10px rgba(23, 61, 58, .18));
      }
      .label {
        position: absolute; z-index: 3; right: 24px; bottom: 22px; left: 24px;
        padding: 10px 14px; border: 3px solid #173d3a; border-radius: 999px;
        color: #fff; background: #e96f5b; font-family: ui-monospace, Menlo, monospace;
        font-size: 21px; font-weight: 900; letter-spacing: .04em; text-align: center;
      }
    </style>
  </head>
  <body>
    <main class="icon">
      <img src="../tool/assets/cat-idle.png" alt="异瞳白猫" />
      <div class="label">LUMI · BLINK · REST</div>
    </main>
  </body>
</html>
